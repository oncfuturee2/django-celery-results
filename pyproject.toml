[tool.ruff]
target-version = "py38"
src = ["django_celery_results", "t"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "N",
    "D",
    "I",
]
ignore = [
    "N806",
    "N802",
    "N801",
    "N803",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D205",
    "D208",
    "D209",
    "D210",
    "D212",
    "D213",
    "D400",
    "D401",
    "D403",
    "D411",
    "D415",
    "D417",
    "I001",
    "RUF012",
    "RUF059",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["django_celery_results", "t"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
